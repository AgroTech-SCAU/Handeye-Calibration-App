
name: "📋 一般任务"
description: "实验、标定、部署、文档、代码整理等明确任务"
title: "[Task] <请在此处输入简要描述>"
body:
  - type: textarea
    id: task
    attributes:
      label: 任务内容
      description: 需要完成什么？
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 背景 / 输入
      description: 任务从哪里来？有哪些前置资料或依赖？

  - type: textarea
    id: done
    attributes:
      label: 完成条件
      placeholder: |
        - [ ] 输出 / 结果 1
        - [ ] 输出 / 结果 2
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充说明 / 风险

  - type: markdown
    attributes:
      value: |
        ### 如果本任务需要修改仓库
        创建 Issue 后，在右侧 **Development → Create a branch**；根据任务内容可使用 `docs/xxx`、`chore/xxx`、`refactor/xxx` 等分支；分支名以清晰可读为主，不做硬性格式检查
